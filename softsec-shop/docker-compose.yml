services:
  db:
     image: mysql:8.0
     ports:
      - "3306:3306"
     command:
      - --default_authentication_plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
     volumes:
       - db_data:/var/lib/mysql
     restart: unless-stopped
     environment:
       MYSQL_ROOT_PASSWORD: root
       MYSQL_DATABASE: flaskshop
     networks: 
      - webnet

  redis:
    image: library/redis:5.0-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: 
      - webnet

  elasticsearch:
    image: elasticsearch:8.11.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: 
      - webnet

  web:
    build: 
      context: .
      args:
        - HOST_UID=1000
    depends_on:
      - db
      - redis
      - elasticsearch
    ports:
      - "5000:5000"
    environment:
      DB_URI: mysql+pymysql://root:root@db:3306/flaskshop?charset=utf8mb4
      REDIS_URI: redis://redis:6379
      ESEARCH_URI: http://elasticsearch:9200
      FLASK_DEBUG: 1
    restart: unless-stopped
    env_file:
      - .env
    networks: 
      - webnet
  
  nginx:
    image: nginx:stable-alpine
    container_name: softsec-shop-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/server.crt:/etc/ssl/certs/server.crt:ro
      - ./certs/server.key:/etc/ssl/private/server.key:ro
    networks: 
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  db_data:
  redis-data:
  elasticsearch-data:
